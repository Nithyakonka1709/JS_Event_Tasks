<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>✨ Dynamic Interactive Playground ✨</title>

<!-- Link External CSS -->
<link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>🌈 Dynamic Interactive Playground 🌈</h1>

  <!-- Sounds -->
  <audio id="hoverSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3f7c76f5c3.mp3?filename=soft-click-112171.mp3" preload="auto"></audio>
  <audio id="bgMusic" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7a9dfd6f48.mp3?filename=relaxing-calm-music-112143.mp3" preload="auto" loop></audio>

  <section>
    <h2>Task 1: Toggle Paragraph</h2>
    <button id="toggleBtn">Hide</button>
    <p id="hiddenPara">Hey there! 👋 I’ll fade in and out smoothly when you click the button!</p>
  </section>

  <section>
    <h2>Task 2: Floating Boxes</h2>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </section>

  <section>
    <h2>Task 3: Input Validation</h2>
    <input type="text" placeholder="Enter text 1">
    <input type="text" placeholder="Enter text 2">
    <span id="result"></span>
  </section>

  <section>
    <h2>Task 4: Form Validation</h2>
    <form id="formId">
      <input type="text" placeholder="Name">
      <input type="email" placeholder="Email">
      <input type="number" placeholder="Age">
      <button type="submit">Submit</button>
    </form>
    <div id="message"></div>
  </section>

  <section>
    <h2>Task 5: Theme Selector</h2>
    <label><input type="radio" name="theme" value="Light"> Light</label>
    <label><input type="radio" name="theme" value="Dark"> Dark</label>
    <div id="themeMsg"></div>
  </section>

  <section>
    <h2>Task 6: To-Do List</h2>
    <ul id="taskList">
      <li>Task A</li>
      <li>Task B</li>
    </ul>
    <input type="text" id="newTask" placeholder="Enter new task">
    <button id="addTaskBtn" disabled>Add Task</button>
  </section>

<!-- External JS -->
<script src="script.js"></script>

</body>
</html>
